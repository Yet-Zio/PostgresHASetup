# Global settings apply to the entire HAProxy process
global
    # Log to docker's logging system
    log stdout format raw local0
    # Maximum concurrent connections HAProxy handles
    maxconn 1000

# Default settings inherited by all frontends and backends
defaults
    log global
    # TCP mode — we're proxying raw TCP, not HTTP
    mode tcp
    # Log each connection
    option tcplog
    # Timeout waiting for a connection to be established
    timeout connect 5s
    # Timeout waiting for client to send data
    timeout client 30s
    # Timeout waiting for server to respond
    timeout server 30s
    # How often to run health checks
    timeout check 5s

# Frontend = the port your application connects to
# This frontend handles WRITE connections (port 5000)
frontend postgres_write
    # Listen on all interfaces on port 5000
    bind *:5000
    # Send traffic to the write backend
    default_backend postgres_primary

# Backend = the actual servers HAProxy routes to
# postgres_primary only routes to the current primary
backend postgres_primary
    # Use HTTP health checks (Patroni REST API)
    option httpchk GET /primary
    # Check Patroni's REST API on port 8008
    http-check expect status 200

    # If patroni-replica gets promoted, it returns 200 and traffic goes there
    server patroni-primary patroni-primary:5432 check port 8008
    server patroni-replica patroni-replica:5432 check port 8008
    server patroni-replica2 patroni-replica2:5432 check port 8008

# Frontend for READ connections (port 5001)
frontend postgres_read
    bind *:5001
    default_backend postgres_replicas

# Backend that accepts both primary and replicas for reads
backend postgres_replicas
    option httpchk GET /replica
    http-check expect status 200
    # balance roundrobin spreads reads evenly across replicas
    balance roundrobin
    server patroni-primary patroni-primary:5432 check port 8008
    server patroni-replica patroni-replica:5432 check port 8008
    server patroni-replica2 patroni-replica2:5432 check port 8008

frontend stats
    bind *:7000
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
