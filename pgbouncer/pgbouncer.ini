[databases]
* = host=haproxy port=__HAPROXY_PORT__

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp

; --- Authentication (auth_query only) ---
auth_type = scram-sha-256
auth_dbname = postgres
auth_file = /etc/pgbouncer/userlist.txt
auth_user = pgbouncer_auth
auth_query = SELECT usename, passwd FROM pgbouncer.user_lookup($1)

; --- Pooling ---
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; --- Fix DBeaver "invalid server parameter" ---
ignore_startup_parameters = extra_float_digits,search_path,options,timezone,TimeZone

pidfile = /var/run/pgbouncer/pgbouncer.pid
logfile = /var/log/pgbouncer/pgbouncer.log

; --- Timeouts ---
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 5
query_timeout = 120
query_wait_timeout = 10
client_login_timeout = 60

; --- Logging ---
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

; --- Admin ---
admin_users = pgbouncer_auth
stats_users = pgbouncer_auth

; --- Transaction pooling safety ---
server_reset_query = DISCARD ALL
server_reset_query_always = 0
